name: Build M40 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - 'KernelSU-Next'

permissions:
  contents: write

jobs:
  build_kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            curl zip unzip \
            git libssh-dev rsync libelf-dev dwarves libssl-dev \
            linux-modules-extra-$(uname -r) build-essential bc

      - name: Fetch toolchains
        run: |
          KERNEL_DIR="$(pwd)"
          mkdir -p "$KERNEL_DIR/../toolchains"
          # Clang r416183b — the version confirmed working for this kernel
          git clone --depth=1 https://github.com/Minha-D/clang-r383902b "$KERNEL_DIR/../toolchains/clang"
          # GCC aarch64/arm — only used for CROSS_COMPILE (binutils/ld/as), Clang is the real compiler
          git clone --depth=1 https://github.com/Minha-D/linaro-toolchain-latest-latest-5 "$KERNEL_DIR/../toolchains/gcc64"
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 "$KERNEL_DIR/../toolchains/gcc32"

          cd "$KERNEL_DIR"

      - name: Fetch AnyKernel3
        run: |
          KERNEL_DIR="$(pwd)"
          # Verify this template's anykernel.sh (partition names, slot handling, DTB
          # config) actually matches the M40 before relying on it — it's carried
          git clone --branch m405d https://github.com/Minha-D/AnyKernel3.git "$KERNEL_DIR/../AnyKernel3"

      - name: Get KernelSU-Next
        run: |
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Get SUSFS Patches
        run: |
            KERNEL_DIR="$(pwd)"
            git clone --branch mainline https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git "$KERNEL_DIR/../ksu-susfs"
            cp "$KERNEL_DIR/../ksu-susfs/Patches/Patch/susfs_patch_to_4.14.patch" "$KERNEL_DIR/"

      - name: Apply Patches
        run: |
            KERNEL_DIR="$(pwd)"
            cd "$KERNEL_DIR"
            chmod +x syscall_hook_patches.sh
            bash syscall_hook_patches.sh
            patch -p1 < susfs_patch_to_4.14.patch || true
            python3 fix_susfs_hunks_v2.py
            chmod +x apply_susfs_ksun_m40.sh
            bash apply_susfs_ksun_m40.sh || true

      - name: Detect versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # SUSFS: read from the patched header (same source the Kbuild greps)
          SUSFS_VER=$(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h 2>/dev/null \
                      | cut -d' ' -f3 | tr -d '"')
          [ -z "$SUSFS_VER" ] && SUSFS_VER="unknown"

          # KernelSU-Next: prefer the cloned repo's own tag, fall back to GitHub API
          KSUN_VER=""
          for d in KernelSU-Next drivers/kernelsu; do
            if [ -e "$d/.git" ]; then
              KSUN_VER=$(git -C "$d" describe --tags --abbrev=0 2>/dev/null) && break
            fi
          done
          if [ -z "$KSUN_VER" ]; then
            KSUN_VER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags \
              | grep -m1 '"name"' | cut -d'"' -f4)
          fi
          [ -z "$KSUN_VER" ] && KSUN_VER="unknown"

          # Kernel version, so it isn't hardcoded in the release notes either
          KERNEL_VER=$(make -s kernelversion 2>/dev/null || echo "unknown")

          echo "susfs=$SUSFS_VER"   >> "$GITHUB_OUTPUT"
          echo "ksun=$KSUN_VER"     >> "$GITHUB_OUTPUT"
          echo "kernel=$KERNEL_VER" >> "$GITHUB_OUTPUT"
          echo "KSU-Next=$KSUN_VER SUSFS=$SUSFS_VER Kernel=$KERNEL_VER"

      - name: Add Python2 Support
        run: |
            sudo apt-get update
            sudo apt-get install -y python2

            sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 10
            sudo update-alternatives --set python /usr/bin/python2


      - name: Build kernel
        run: |

          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Package AnyKernel3 zip
        id: package
        run: |
          KERNEL_DIR="$(pwd)"
          cd "$KERNEL_DIR/../AnyKernel3"
          ZIP_NAME="m40-ksu-next-susfs-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP_NAME" . -x '.git*' -x '*.md'
          mkdir -p "$KERNEL_DIR/../files"
          mv "$ZIP_NAME" "$KERNEL_DIR/../files/$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/../files/${{ steps.package.outputs.zip_name }}
          name: M40 KernelSU-Next + SUSFS ${{ github.run_number }}
          tag_name: ${{ github.run_number }}
          body: |
            **M40 (sm6150) kernel — KernelSU-Next ${{ steps.ver.outputs.ksun }} (manual hooks) + SUSFS ${{ steps.ver.outputs.susfs }}**

            - Kernel: ${{ steps.ver.outputs.kernel }}
            - Clang: r383902b
            - Flash directly with KSU-Next Manager's AnyKernel3 support, or any
              custom recovery that supports AnyKernel3 zips.

            :rocket: Built with GitHub Actions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
